name: Sync Upstream

on:
  schedule:
    # 每天 UTC 00:00 运行（北京时间 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/guoh064/AzurLaneAutoScript.git || true
          git fetch upstream

      - name: Check if upstream has new commits
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          # Check if upstream/main is already an ancestor of origin/master
          # i.e., master already contains upstream/main → no update needed
          if git merge-base --is-ancestor upstream/main origin/master; then
            echo "upstream/main is already in master, skipping sync"
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "upstream/main has new commits not in master, syncing"
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync overlay patches
        id: merge
        if: steps.check.outputs.has_updates == 'true'
        run: |
          pwsh -File ./scripts/sync_overlay.ps1 -Author quark-mac -Push
        continue-on-error: true

      - name: Abort failed merge
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outcome == 'failure'
        run: |
          git merge --abort || true

      - name: Create issue on conflict
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ Upstream sync failed - Manual intervention required';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict'
            });
            const existingIssue = issues.data.find(issue => issue.title === title);
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                labels: ['sync-conflict'],
                body: 'The upstream sync PR could not be prepared because merging upstream/main caused conflicts.\n\n**Please manually sync using:**\n\n```bash\ngit fetch upstream\ngit merge upstream/main\n# Resolve conflicts manually\ngit add <conflicted-files>\ngit commit\ngit push origin master\n```\n\n**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: 'Another sync attempt failed.\n\n**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
              });
            }
